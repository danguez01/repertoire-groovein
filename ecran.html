<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groove In — Écran public</title>
<style>
  :root { --bg: #000; --fg: #fff; --fs: 5vh; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; cursor: none; }
  body.show-cursor { cursor: default; }
  #scroller { position: absolute; inset: 0; overflow-y: scroll; scrollbar-width: none; padding: 12vh 6vw 40vh; scroll-behavior: smooth; }
  #scroller::-webkit-scrollbar { display: none; }
  .song { margin-bottom: 18vh; text-align: center; }
  .song h1 { font-size: calc(var(--fs) * 0.6); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin: 0 0 4vh; }
  .song p { font-size: var(--fs); line-height: 1.32; font-weight: 700; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .song p.gap { height: calc(var(--fs) * 0.9); }
  /* Mode accords : police fixe, accords en couleur, alignement conservé */
  body.mode-accords .song { text-align: left; width: max-content; margin-left: auto; margin-right: auto; }
  body.mode-accords .song h1 { text-align: center; }
  body.mode-accords .song div { font-family: "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: var(--fs); line-height: 1.3; white-space: pre; font-weight: 500; }
  body.mode-accords .song div.c { color: #6cb6ff; font-weight: 800; }
  body.mode-accords .song div.s { color: #f0a868; font-weight: 800; text-transform: uppercase; margin-top: .5em; }
  body.mode-accords .song div.b { opacity: .85; }
  body.mode-accords .song div.g { height: .7em; }
  body.mode-accords #scroller { padding: 8vh 2vw 40vh; }
  /* Paroles + accords : paroles en très gros, accords plus petits au-dessus */
  .song.with-chords { width: max-content; margin-left: auto; margin-right: auto; text-align: left; }
  .song.with-chords h1 { text-align: center; }
  .song.with-chords .pair { position: relative; padding-top: calc(var(--lfs) * 0.78); }
  .song.with-chords .ch { position: absolute; top: 0; font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: calc(var(--lfs) * 0.62); font-weight: 800; color: #f0a868; line-height: 1; white-space: pre; }
  .song.with-chords .lyr { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: var(--lfs); font-weight: 800; line-height: 1.2; white-space: pre; }
  .song.with-chords .onlychords { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: calc(var(--lfs) * 0.62); font-weight: 800; color: #f0a868; white-space: pre; margin: .3em 0; }
  .song.with-chords .sec { font-size: calc(var(--lfs) * 0.5); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin: .8em 0 .2em; }
  .song.with-chords .gap { height: calc(var(--lfs) * 0.6); }
  /* Logo en coin */
  #logo-corner { position: fixed; z-index: 5; display: none; pointer-events: none; }
  #logo-corner img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  /* Logo plein écran */
  #logo-full { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; background: var(--bg); }
  #logo-full img { max-width: 70vw; max-height: 70vh; object-fit: contain; }
  body.logo-full #logo-full { display: flex; }
  #wait { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 3vh; opacity: .6; padding: 0 10vw; }
  #hint { position: fixed; left: 0; right: 0; bottom: 2vh; z-index: 20; text-align: center; font-size: 2vh; opacity: 0; transition: opacity .4s; }
  body.show-cursor #hint { opacity: .55; }
</style>
</head>
<body>
<div id="scroller"></div>
<div id="logo-corner"><img id="logo-corner-img" alt=""></div>
<div id="logo-full"><img id="logo-full-img" alt=""></div>
<div id="wait">En attente de l'application Groove In…<br>(cette fenêtre se remplit toute seule)</div>
<div id="hint">Double-clic = plein écran · + / − = taille du texte · L = logo (paroles)</div>
<script>
(function () {
  const sc = document.getElementById("scroller");
  const cornerEl = document.getElementById("logo-corner");
  const cornerImg = document.getElementById("logo-corner-img");
  const fullImg = document.getElementById("logo-full-img");
  const waitEl = document.getElementById("wait");
  let cfg = {}, localFs = null, lastRatio = 0, lastSongs = [];
  const MODE = new URLSearchParams(location.search).get("mode") === "accords" ? "accords" : "paroles";
  if (MODE === "accords") document.body.classList.add("mode-accords");
  const opener = window.opener;

  function contrast(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#fff";
    const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#000" : "#fff";
  }
  function applyCfg(c) {
    cfg = c || {};
    const bg = cfg.bg || "#000000";
    document.documentElement.style.setProperty("--bg", bg);
    document.documentElement.style.setProperty("--fg", contrast(bg));
    document.documentElement.style.setProperty("--fs", (localFs || cfg.fs || 5) + "vh");
    const src = cfg.logoSrc || "icon-512.png";
    cornerImg.src = src; fullImg.src = src;
    document.body.classList.toggle("logo-full", !!cfg.logoFull && MODE !== "accords");
    // Logo en coin
    const pos = cfg.pos || "bottom-right", size = cfg.size || 14;
    if (pos === "none" || MODE === "accords") { cornerEl.style.display = "none"; }
    else {
      cornerEl.style.display = "block";
      cornerEl.style.cssText = "position:fixed;z-index:5;pointer-events:none;display:block;width:" + size + "vw;height:" + size + "vh;";
      const v = pos.indexOf("top") === 0 ? "top:2.5vh;" : "bottom:2.5vh;";
      const h = pos.indexOf("left") > -1 ? "left:2.5vw;" : (pos.indexOf("right") > -1 ? "right:2.5vw;" : "left:50%;transform:translateX(-50%);");
      cornerEl.style.cssText += v + h;
      cornerImg.style.objectPosition = pos.indexOf("left") > -1 ? "left" : (pos.indexOf("right") > -1 ? "right" : "center");
    }
  }
  // Mode accords : taille de police calculée pour que la plus longue ligne tienne en largeur
  function fitAccords(songs) {
    let maxChars = 20;
    (songs || []).forEach(s => (s.rows || []).forEach(r => { if (r.s && r.s.length > maxChars) maxChars = r.s.length; }));
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:100px";
    probe.textContent = "0".repeat(50); document.body.appendChild(probe);
    const cw = probe.getBoundingClientRect().width / 50 / 100; probe.remove(); // largeur d'un caractère pour 1px de police
    const avail = window.innerWidth * 0.94;
    const fit = avail / (maxChars * (cw || 0.6));
    const want = localFs ? localFs : 9999;
    document.documentElement.style.setProperty("--fs", Math.max(14, Math.min(fit, want, window.innerHeight * 0.075)) + "px");
  }
  function renderAccords(songs) {
    sc.innerHTML = "";
    (songs || []).forEach(s => {
      const d = document.createElement("div"); d.className = "song";
      if (cfg.showTitle !== false && s.title) { const h = document.createElement("h1"); h.textContent = s.title; d.appendChild(h); }
      (s.rows || []).forEach(r => { const x = document.createElement("div"); x.className = r.t; x.textContent = r.s || ""; d.appendChild(x); });
      sc.appendChild(d);
    });
    waitEl.style.display = (songs && songs.length) ? "none" : "flex";
    if (!(songs && songs.length)) waitEl.textContent = "Aucune chanson affichée — choisis une chanson dans Groove In.";
    fitAccords(songs);
  }
  // Paroles en gros + accords plus petits (colonnes conservées via une largeur de caractère mesurée)
  function renderWithChords(songs) {
    let cols = 20;
    (songs || []).forEach(s => { if (s.cols && s.cols > cols) cols = s.cols; });
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace;font-weight:800;font-size:100px";
    probe.textContent = "0".repeat(50); document.body.appendChild(probe);
    const cw1 = (probe.getBoundingClientRect().width / 50 / 100) || 0.6; probe.remove();
    const lfs = Math.max(16, Math.min(window.innerWidth * 0.94 / (cols * cw1), window.innerHeight * 0.1));
    document.documentElement.style.setProperty("--lfs", lfs + "px");
    const cw = lfs * cw1, cchars = lfs * 0.62 * cw1;
    sc.innerHTML = "";
    songs.forEach(sg => {
      const d = document.createElement("div"); d.className = "song with-chords";
      if (cfg.showTitle !== false && sg.title) { const h = document.createElement("h1"); h.textContent = sg.title; d.appendChild(h); }
      (sg.rows || []).forEach(r => {
        if (r.g) { const x = document.createElement("div"); x.className = "gap"; d.appendChild(x); return; }
        if (r.sec) { const x = document.createElement("div"); x.className = "sec"; x.textContent = r.sec; d.appendChild(x); return; }
        if (r.l === undefined || r.l === "") { if (r.c) { const x = document.createElement("div"); x.className = "onlychords"; x.textContent = r.c; d.appendChild(x); } return; }
        const pr = document.createElement("div"); pr.className = "pair";
        const re = /\S+/g; let m;
        while (r.c && (m = re.exec(r.c)) !== null) { const c = document.createElement("span"); c.className = "ch"; c.textContent = m[0]; c.style.left = (m.index * cw) + "px"; pr.appendChild(c); }
        const l = document.createElement("div"); l.className = "lyr"; l.textContent = r.l; pr.appendChild(l);
        if (!(r.c && r.c.trim())) pr.style.paddingTop = "0";
        d.appendChild(pr);
      });
      sc.appendChild(d);
    });
    waitEl.style.display = songs.length ? "none" : "flex";
    if (!songs.length) waitEl.textContent = "Aucune chanson affichée — choisis une chanson dans Groove In.";
  }
  function renderSongs(songs) {
    lastSongs = songs || [];
    if (MODE === "accords") { renderAccords(songs); return; }
    if (songs && songs.length && songs[0].rows) { renderWithChords(songs); return; }
    const keep = sc.scrollTop;
    sc.innerHTML = "";
    (songs || []).forEach(s => {
      const d = document.createElement("div"); d.className = "song";
      if (cfg.showTitle !== false && s.title) { const h = document.createElement("h1"); h.textContent = s.title; d.appendChild(h); }
      (s.lines || []).forEach(l => {
        const p = document.createElement("p");
        if (l === "") p.className = "gap"; else p.textContent = l;
        d.appendChild(p);
      });
      sc.appendChild(d);
    });
    waitEl.style.display = (songs && songs.length) ? "none" : "flex";
    if (songs && songs.length) waitEl.style.display = "none"; else waitEl.textContent = "Aucune chanson affichée — choisis une chanson dans Groove In.";
    sc.style.scrollBehavior = "auto"; sc.scrollTop = keep; setScroll(lastRatio, true); sc.style.scrollBehavior = "";
  }
  function setScroll(r, instant) {
    lastRatio = r;
    const max = sc.scrollHeight - sc.clientHeight;
    if (instant) sc.style.scrollBehavior = "auto";
    sc.scrollTop = Math.max(0, Math.min(1, r)) * max;
    if (instant) sc.style.scrollBehavior = "";
  }

  window.addEventListener("message", e => {
    if (opener && e.source !== opener) return;
    const d = e.data || {};
    if (d.type === "public-state") { if ((d.mode || "paroles") !== MODE) return; applyCfg(d.cfg); renderSongs(d.songs); setScroll(d.scroll || 0, true); }
    else if (d.type === "public-cfg") { applyCfg(d.cfg); }
    else if (d.type === "public-scroll") { setScroll(d.scroll || 0, false); }
  });
  function hello() { try { if (opener) opener.postMessage({ type: "public-hello" }, "*"); } catch (e) {} }
  hello(); setTimeout(hello, 800);
  window.addEventListener("resize", () => { if (MODE === "accords") fitAccords(lastSongs); else if (lastSongs[0] && lastSongs[0].rows) renderWithChords(lastSongs); setScroll(lastRatio, true); });

  // Plein écran : double-clic ; + / − taille ; L logo ; F plein écran
  function toggleFs() {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
  document.addEventListener("dblclick", toggleFs);
  document.addEventListener("keydown", e => {
    if (e.key === "f" || e.key === "F") toggleFs();
    else if (MODE === "accords" && (e.key === "+" || e.key === "-" || e.key === "=" || e.key === "_")) {
      const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 24;
      localFs = Math.max(14, cur * ((e.key === "+" || e.key === "=") ? 1.08 : 0.92));
      fitAccords(lastSongs); setScroll(lastRatio, true);
    }
    else if (e.key === "+" || e.key === "=") { localFs = Math.min(12, (localFs || cfg.fs || 5) + 0.4); document.documentElement.style.setProperty("--fs", localFs + "vh"); setScroll(lastRatio, true); }
    else if (e.key === "-" || e.key === "_") { localFs = Math.max(2, (localFs || cfg.fs || 5) - 0.4); document.documentElement.style.setProperty("--fs", localFs + "vh"); setScroll(lastRatio, true); }
    else if (MODE !== "accords" && (e.key === "l" || e.key === "L")) { cfg.logoFull = !cfg.logoFull; document.body.classList.toggle("logo-full", cfg.logoFull); }
  });
  let hideT; document.addEventListener("mousemove", () => { document.body.classList.add("show-cursor"); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove("show-cursor"), 2500); });
  applyCfg({});
})();
</script>
</body>
</html>
